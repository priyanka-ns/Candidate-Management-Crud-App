<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Update Candidate — UI Preview</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
	integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body style="background-color: #9bd7e7;">
	<nav class="navbar navbar-expand-md navbar-dark bg-dark" style="text-align:center">
		<div class="container-fluid">
			<a class="navbar-brand" href="index.html">Candidate Application</a>
			<div class="collapse navbar-collapse">
				<ul class="navbar-nav mb-2 mb-lg-0">
					<li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<div class="container p-4">
		<div class="row">
			<div class="col-md-6 offset-md-3">
				<div class="card">
					<div class="card-body">
						<h4 class="text-center" style="color:#149FDC">Edit Candidate Form</h4>
						<p class="text-center small text-muted">Static UI preview — form submission is disabled here.</p>
						<form onsubmit="return false;">
							<div class="mb-3"><label class="form-label">Enter Candidate's First Name</label>
								<input type="text" class="form-control" name="candidateFirstName" value="Aarav"></div>
							<div class="mb-3"><label class="form-label">Enter Candidate's Last Name</label>
								<input type="text" class="form-control" name="candidateLastName" value="Sharma"></div>
							<div class="mb-3"><label class="form-label">Enter Email</label>
								<input type="email" class="form-control" name="candidateEmail" value="aarav.sharma@example.com"></div>
							<div class="mb-3"><label class="form-label">Enter Phone No</label>
								<input type="number" class="form-control" name="phoneNo" value="9876543210"></div>
							<div class="mb-3"><label class="form-label">Enter Candidate's Location</label>
								<input type="text" class="form-control" name="location" value="Mumbai"></div>
							<div class="mb-3"><label class="form-label">Education of Candidate</label>
								<input type="text" class="form-control" name="education" value="B.E. Computer"></div>
							<div class="mb-3"><label class="form-label">Enter Experience of Candidate (In Years)</label>
								<input type="number" step="0.01" class="form-control" name="experience" value="3.5"></div>
							<div class="mb-3"><label class="form-label">Source of Candidate</label>
								<select name="source" class="form-control">
									<option value="agency">Agency</option>
									<option value="careerSite">Career Site</option>
									<option value="direct">Direct</option>
									<option value="employeeReferral" selected>Employee Referral</option>
									<option value="naukri">Naukri</option>
									<option value="sms">SMS</option>
									<option value="socialNetwork">Social Network</option>
								</select></div>
							<div class="mb-3"><label class="form-label">Status of Candidate</label>
								<select name="status" class="form-control">
									<option value="applied">Applied</option>
									<option value="hired">Hired</option>
									<option value="offered">Offered</option>
									<option value="rejected">Rejected</option>
									<option value="suggested">Suggested</option>
									<option value="round1">Round 1</option>
									<option value="round2" selected>Round 2</option>
									<option value="round3">Round 3</option>
								</select></div>
							<button type="submit" class="btn btn-sm btn-info btn-lg btn-outline-success" style="color:#FFFFFF">Update Candidate</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
